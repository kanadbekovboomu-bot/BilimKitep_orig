<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="spineShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="3%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="7%" stop-color="#000000" stop-opacity="0.15"/>
      <stop offset="12%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base Cover with Rounded Book Corners -->
  <rect x="0" y="0" width="600" height="850" rx="18" fill="url(#bgGrad_9)" />

  <!-- Authentic Pattern Background Rings -->
  <circle cx="300" cy="440" r="240" fill="none" stroke="#93c5fd" stroke-opacity="0.12" stroke-width="40" />
  <circle cx="300" cy="440" r="170" fill="none" stroke="#93c5fd" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="8,6" />

  <!-- Ornate Border Frame -->
  <rect x="24" y="24" width="552" height="802" rx="12" fill="none" stroke="#93c5fd" stroke-opacity="0.4" stroke-width="2" />
  <rect x="32" y="32" width="536" height="786" rx="10" fill="none" stroke="#93c5fd" stroke-opacity="0.2" stroke-width="1" />

  <!-- Ministry Header -->
  <text x="300" y="68" fill="#ffffff" fill-opacity="0.85" font-family="Arial, sans-serif" font-weight="bold" font-size="11" text-anchor="middle" letter-spacing="1.6">
    КЫРГЫЗ РЕСПУБЛИКАСЫНЫН БИЛИМ БЕРҮҮ ЖАНА ИЛИМ МИНИСТРЛИГИ
  </text>

  <!-- Author Name -->
  <text x="300" y="112" fill="#93c5fd" font-family="Arial, sans-serif" font-weight="bold" font-size="18" text-anchor="middle">
    И. Г. Семакин, Л. А. Залогова
  </text>

  <!-- Grade Badge (Top Right) -->
  <g transform="translate(480, 75)">
    <circle cx="32" cy="32" r="34" fill="#93c5fd" stroke="#ffffff" stroke-width="3" />
    <text x="32" y="34" fill="#0f172a" font-family="Arial, sans-serif" font-weight="900" font-size="20" text-anchor="middle">9</text>
    <text x="32" y="49" fill="#0f172a" font-family="Arial, sans-serif" font-weight="bold" font-size="9" text-anchor="middle">КЛАСС</text>
  </g>

  <!-- Central Visual Symbol Badge -->
  <g transform="translate(300, 360)">
    <circle cx="0" cy="0" r="110" fill="#ffffff" fill-opacity="0.06" stroke="#93c5fd" stroke-opacity="0.35" stroke-width="3" />
    <!-- Tunduk Sun Rays -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="#93c5fd" stroke-width="3.5" />
    <line x1="-30" y1="-8" x2="30" y2="8" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-30" y1="8" x2="30" y2="-8" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-8" y1="-30" x2="8" y2="30" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" />
    <line x1="8" y1="-30" x2="-8" y2="30" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" />
    <!-- Subject Symbol Text -->
    <text x="0" y="70" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="16" text-anchor="middle" letter-spacing="1">
      CODE
    </text>
  </g>

  <!-- Book Title Banner -->
  <g transform="translate(300, 560)">
    <rect x="-250" y="-42" width="500" height="84" rx="18" fill="#0f172a" fill-opacity="0.75" stroke="#93c5fd" stroke-width="1.8" />
    <text x="0" y="10" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="26" text-anchor="middle" letter-spacing="1.2">
      ИНФОРМАТИКА И ИКТ
    </text>
  </g>

  <!-- Subtitle Description -->
  <text x="300" y="660" fill="#ffffff" fill-opacity="0.85" font-family="Arial, sans-serif" font-weight="500" font-size="14" text-anchor="middle">
    Основы алгоритмизации и цифровых технологий
  </text>

  <!-- Bottom Publisher -->
  <g transform="translate(300, 775)">
    <rect x="-160" y="-22" width="320" height="44" rx="22" fill="#ffffff" fill-opacity="0.1" />
    <text x="0" y="6" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="13" text-anchor="middle" letter-spacing="1">
      БИШКЕК • «БИЛИМ-КОМПЬЮТЕР»
    </text>
  </g>

  <!-- Physical 3D Left Spine Lighting Effect -->
  <rect x="0" y="0" width="65" height="850" fill="url(#spineShadow)" />
  <line x1="65" y1="0" x2="65" y2="850" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" />
</svg>